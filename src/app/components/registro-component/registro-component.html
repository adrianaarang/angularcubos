<div class="min-h-[80vh] flex items-center justify-center px-4">
  <div class="w-full max-w-sm bg-white rounded-lg shadow p-6">
    <h2 class="text-center text-xl font-bold text-gray-900 mb-6">Crear cuenta</h2>
    <form (ngSubmit)="registrar()" class="space-y-4">
      <div>
        <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
        <input id="nombre" name="nombre" type="text"
               class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
               placeholder="Nombre" [(ngModel)]="nombre" required />
      </div>
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input id="email" name="email" type="email"
               class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
               placeholder="Email" [(ngModel)]="email" required />
      </div>
      <div>
        <label for="pwd" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <input id="pwd" name="pwd" type="password"
               class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
               placeholder="Contraseña" [(ngModel)]="password" required />
      </div>
      <button type="submit"
              class="w-full rounded-md bg-green-600 text-white font-medium py-2 hover:bg-green-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
              [disabled]="enviando()">
        {{ enviando() ? 'Creando cuenta...' : 'Registrarse' }}
      </button>
    </form>
    @if (error()) {
      <div class="mt-3 rounded-md bg-red-50 text-red-700 text-sm px-3 py-2">{{ error() }}</div>
    }
    <p class="text-center text-sm text-gray-600 mt-4">
      ¿Ya tienes cuenta? <a [routerLink]="['/login']" class="text-blue-600 hover:underline">Inicia sesión</a>
    </p>
  </div>
</div>
