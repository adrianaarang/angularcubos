<div class="max-w-6xl mx-auto px-4 mt-6">
  <a class="inline-block px-4 py-2 rounded-md bg-yellow-400 text-gray-900 font-medium hover:bg-yellow-500 transition-colors mb-6"
     [routerLink]="['/pedidos']">Nuevo pedido</a>

  <div class="flex flex-wrap gap-6">
    @for (pedido of pedidos(); track pedido.idPedido) {
      <div class="w-full sm:w-72 bg-white rounded-lg shadow overflow-hidden">
        <div class="px-4 py-3 border-b border-gray-200">
          <h5 class="font-semibold text-gray-900">Pedido #{{ pedido.idPedido }}</h5>
        </div>
        <ul class="divide-y divide-gray-200">
          <li class="px-4 py-2 text-sm text-gray-700"><strong class="text-gray-900">ID cubo:</strong> {{ pedido.idCubo }}</li>
          <li class="px-4 py-2 text-sm text-gray-700"><strong class="text-gray-900">ID usuario:</strong> {{ pedido.idUsuario }}</li>
          <li class="px-4 py-2 text-sm text-gray-700"><strong class="text-gray-900">Fecha:</strong> {{ pedido.fechaPedido }}</li>
        </ul>
      </div>
    } @empty {
      <p class="text-gray-400">Todavía no tienes pedidos.</p>
    }
  </div>
</div>
