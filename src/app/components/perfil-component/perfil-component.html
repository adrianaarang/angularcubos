<div class="max-w-md mx-auto px-4 mt-6">
  @if (user(); as u) {
    <div class="bg-white rounded-lg shadow p-6 space-y-2">
      <h3 class="text-lg font-semibold text-gray-900">Nombre: {{ u.nombre }}</h3>
      <h3 class="text-lg font-semibold text-gray-900">Email: {{ u.email }}</h3>
    </div>
  } @else {
    <p class="text-gray-500 text-center">Cargando perfil...</p>
  }
</div>
